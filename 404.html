<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — WebCraft Studio</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07080d">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Estilos inline: la 404 se sirve desde cualquier ruta, así no depende de rutas relativas */
    :root { --bg:#07080d; --text:#e8eaf2; --muted:#9097ab; --cyan:#22d3ee; --violet:#8b5cf6; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:"Inter",system-ui,sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased; }
    main { min-height:100vh; min-height:100dvh; display:grid; place-items:center; text-align:center; padding:40px 20px;
      background: radial-gradient(600px 400px at 50% 30%, rgba(139,92,246,.18), transparent 70%), var(--bg); }
    .code { font-family:"Space Grotesk",system-ui,sans-serif; font-weight:700; font-size:clamp(5rem,22vw,9rem); line-height:1; letter-spacing:-.04em;
      background:linear-gradient(120deg,var(--cyan),var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    h1 { font-family:"Space Grotesk",system-ui,sans-serif; font-size:clamp(1.5rem,4vw,2rem); margin:12px 0 10px; letter-spacing:-.02em; }
    p { color:var(--muted); max-width:28em; margin:0 auto 28px; }
    a.btn { display:inline-flex; align-items:center; gap:8px; padding:.85em 1.4em; border-radius:999px; font-weight:600; color:#fff; text-decoration:none;
      background:linear-gradient(120deg,var(--cyan),var(--violet)); transition:transform .2s; }
    a.btn:hover { transform:translateY(-2px); }
    a:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <div>
      <div class="code" aria-hidden="true">404</div>
      <h1>Esta página no existe… todavía</h1>
      <p>Puede que el enlace esté mal escrito o que la página se haya movido. Vuelve al inicio y sigue explorando.</p>
      <a class="btn" id="home" href="/">Volver al inicio →</a>
    </div>
  </main>
  <script>
    // En GitHub Pages la web vive en /WebCraft-Studio/
    if (location.hostname.endsWith("github.io")) document.getElementById("home").href = "/WebCraft-Studio/";
  </script>
</body>
</html>
