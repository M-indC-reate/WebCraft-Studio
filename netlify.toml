# Configuración de Netlify (sitio estático, sin build)
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# No publicar archivos internos del repositorio
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
